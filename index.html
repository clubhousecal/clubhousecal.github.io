<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unofficial Clubhouse Show Calendar</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Unofficial Clubhouse Show Calendar</h1>
      <p>
        To add your show, use 
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdwCbm_GQvwf2o8a5i31Y_Sch4cKLl4Xdc1XHysh12XtFRdKA/viewform" target="_blank">this form</a>.
      </p>
      <p>Corrections or suggestions: <a href="mailto:chousecal@gmail.com">chousecal@gmail.com</a></p>
      <div class="meta">
        <span id="lastUpdated" class="hidden"></span>
        <span id="tzLabel" class="hidden"></span>
      </div>
    </header>

    <div id="loadingMessage" class="loading">Loading events…</div>
    <div id="errorMessage" class="error hidden">Failed to load events. Please try again later.</div>

    <section id="controls" class="controls hidden">
      <div class="topbar">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search for a show…" />
        </div>
        <button id="filtersToggleBtn" class="btn secondary mobile-only">Filters</button>
        <div class="view-toggle">
          <button id="listViewBtn" class="btn">List</button>
          <button id="calendarViewBtn" class="btn active">Calendar</button>
        </div>
      </div>

      <div id="filters" class="filters collapsed">
        <select id="stageFilter" class="select"><option value="">Stage</option></select>
        <div class="multi" id="genreMulti">
          <button id="genreBtn" class="multi-btn"><span id="genreBtnLabel">Genre (any)</span> ▼</button>
          <div id="genrePanel" class="multi-panel">
            <input id="genreSearch" type="text" class="multi-search" placeholder="Filter genres…" />
            <div id="genreList" class="multi-list"></div>
          </div>
        </div>
        <select id="dateFilter" class="select">
          <option value="">Date</option>
          <option value="today">Today</option>
          <option value="this-week">This Week</option>
          <option value="this-month">This Month</option>
        </select>
        <button id="clearFiltersBtn" class="btn secondary">Clear</button>
      </div>
      
      <div class="monthbar">
        <button id="prevSpanBtn" class="arrow-btn" aria-label="Previous">◀</button>
        <h2 id="monthLabel" class="calendar-title" aria-live="polite"></h2>
        <button id="nextSpanBtn" class="arrow-btn" aria-label="Next">▶</button>
      </div>
      
      <div class="mode-toggle">
        <div class="segmented" role="group" aria-label="Calendar display mode">
          <button id="modeMonthBtn" class="seg-btn" type="button">Month</button>
          <button id="modeWeekBtn"  class="seg-btn" type="button">Week</button>
        </div>
        <button id="todayBtn" class="btn" aria-label="Jump to current">Today</button>
      </div>
    </section>

    <section id="calendarView" class="hidden">
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section id="listView" class="hidden">
      <div id="eventCards" class="event-cards"></div>
    </section>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <div id="modalTitle" class="modal-title">Event</div>
        <button id="modalClose" class="modal-close">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
